<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Host</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="sayfa">

    <div id="bitirKutu" class="bitirKutu" style="display:none">
      <button class="buton ikincil" id="bitir">Oyunu Bitir</button>
    </div>

    <div id="lobi" class="ekran">
      <img class="logo" id="logo" alt="" style="display:none">
      <h1 class="baslik" id="baslik">Quiz</h1>
      <p class="altBaslik" id="altBaslik"></p>
      <p class="adres">Katılmak için: <b id="adres"></b></p>
      <img class="qr" id="qr" alt="QR kod">
      <h3>PIN</h3>
      <h1 class="pin" id="pinYazi">...</h1>
      <h2 id="oyuncuSayisi">0 oyuncu</h2>
      <ul id="oyuncular"></ul>
      <label class="etiket"><input type="checkbox" id="manuel"> Şıkları ben açacağım</label>
      <button class="buton" id="baslat">Oyunu Başlat</button>
    </div>

    <div id="soruEkrani" class="ekran" style="display:none">
      <h3 id="soruNo"></h3>
      <div class="sureCubuk" id="sureKap"></div>
      <h1 class="soruMetin" id="soruMetin"></h1>
      <div class="sayac" id="sayac"></div>
      <div class="secenekler" id="secenekler"></div>
      <button class="buton" id="siklariAc" style="display:none">Şıkları Aç</button>
      <p class="mesaj" id="cevapSayisi"></p>
    </div>

    <div id="sonucEkrani" class="ekran" style="display:none">
      <h2 id="dogruCevap"></h2>
      <div class="secenekler" id="sonucSecenekler"></div>
      <h3>Skor Tablosu</h3>
      <ul class="top5 genis" id="skorlar"></ul>
      <button class="buton" id="sonraki">Sonraki</button>
    </div>

    <div id="bitisEkrani" class="ekran" style="display:none">
      <div class="kupa">🏆</div>
      <h1>Oyun Bitti!</h1>
      <ul class="top5 genis" id="sonSkorlar"></ul>
      <button class="buton" id="yeniOyun">Yeni Oyun</button>
    </div>

  </div>

  <script src="/ayar.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let pin = "";
    let sayacId = null;
    let sonSecenekler = [];
    const gorulen = new Set();

    baslikKur();
    document.getElementById("adres").textContent = location.host;

    function goster(id) {
      ["lobi", "soruEkrani", "sonucEkrani", "bitisEkrani"].forEach((e) => {
        document.getElementById(e).style.display = e === id ? "block" : "none";
      });
      document.getElementById("bitirKutu").style.display =
        id === "soruEkrani" || id === "sonucEkrani" ? "block" : "none";
    }

    function skorCiz(id, liste) {
      const ul = document.getElementById(id);
      ul.innerHTML = "";
      const madalya = ["🥇", "🥈", "🥉"];
      liste.forEach((o, i) => {
        const li = document.createElement("li");
        li.style.animationDelay = i * 0.12 + "s";
        const sol = document.createElement("span");
        sol.textContent = (madalya[i] || i + 1 + ".") + " " + o.isim;
        const sag = document.createElement("span");
        sag.textContent = o.puan;
        li.appendChild(sol);
        li.appendChild(sag);
        ul.appendChild(li);
      });
    }

    function sureBarKur(id, toplam, kalan) {
      const kap = document.getElementById(id);
      kap.innerHTML = "";
      const d = document.createElement("div");
      d.style.animationDuration = toplam + "s";
      d.style.animationDelay = "-" + Math.max(toplam - kalan, 0) + "s";
      kap.appendChild(d);
    }

    function secenekCiz(id, secenekler, sayilar, dogru) {
      const alan = document.getElementById(id);
      alan.innerHTML = "";
      secenekler.forEach((metin, i) => {
        const d = document.createElement("div");
        d.className = "sec s" + i;
        if (dogru !== undefined && i !== dogru) d.classList.add("soluk");
        d.textContent = sayilar ? metin + " (" + sayilar[i] + ")" : metin;
        alan.appendChild(d);
      });
    }

    if (location.search === "?yeni") {
      localStorage.removeItem("hostPin");
      localStorage.removeItem("hostToken");
    }

    socket.on("connect", () => {
      const kayitliPin = localStorage.getItem("hostPin");
      const kayitliToken = localStorage.getItem("hostToken");
      if (kayitliPin && kayitliToken) {
        socket.emit("hostDon", { pin: kayitliPin, token: kayitliToken });
      } else {
        socket.emit("oyunOlustur");
      }
    });

    socket.on("oturumYok", () => {
      localStorage.removeItem("hostPin");
      localStorage.removeItem("hostToken");
      socket.emit("oyunOlustur");
    });

    socket.on("oyunOlusturuldu", (v) => {
      pin = v.pin;
      localStorage.setItem("hostPin", v.pin);
      localStorage.setItem("hostToken", v.token);
      document.getElementById("pinYazi").textContent = pin;
      document.getElementById("qr").src = "/qr?pin=" + pin;
    });

    socket.on("oyuncuListesi", (isimler) => {
      const liste = document.getElementById("oyuncular");
      liste.innerHTML = "";
      isimler.forEach((isim) => {
        const li = document.createElement("li");
        li.textContent = isim;
        if (!gorulen.has(isim)) {
          li.className = "yeni";
          gorulen.add(isim);
        }
        liste.appendChild(li);
      });
      document.getElementById("oyuncuSayisi").textContent = isimler.length + " oyuncu";
    });

    document.getElementById("baslat").addEventListener("click", () => {
      socket.emit("oyunBaslat", { pin: pin, manuel: document.getElementById("manuel").checked });
    });

    document.getElementById("sonraki").addEventListener("click", () => {
      socket.emit("sonrakiSoru", pin);
    });

    document.getElementById("bitir").addEventListener("click", () => {
      if (confirm("Oyun şimdi bitirilsin mi?")) {
        socket.emit("oyunuBitir", pin);
      }
    });

    document.getElementById("siklariAc").addEventListener("click", () => {
      socket.emit("siklariAc", pin);
    });

    socket.on("okuma", (s) => {
      goster("soruEkrani");
      sonSecenekler = s.secenekler || [];
      clearInterval(sayacId);
      document.getElementById("soruNo").textContent = "Soru " + s.no + " / " + s.toplam;
      document.getElementById("soruMetin").textContent = s.soru;
      document.getElementById("sayac").textContent = "";
      document.getElementById("sureKap").innerHTML = "";
      secenekCiz("secenekler", s.secenekler || []);
      document.getElementById("cevapSayisi").textContent =
        "Şıklar şu an sadece sende görünüyor. Hazır olunca \"Şıkları Aç\"a bas.";
      document.getElementById("siklariAc").style.display = "inline-block";
    });

    document.getElementById("yeniOyun").addEventListener("click", () => {
      localStorage.removeItem("hostPin");
      localStorage.removeItem("hostToken");
      location.reload();
    });

    socket.on("soru", (s) => {
      document.getElementById("siklariAc").style.display = "none";
      goster("soruEkrani");
      sonSecenekler = s.secenekler;
      document.getElementById("soruNo").textContent = "Soru " + s.no + " / " + s.toplam;
      document.getElementById("soruMetin").textContent = s.soru;
      document.getElementById("cevapSayisi").textContent = "";
      secenekCiz("secenekler", s.secenekler);
      sureBarKur("sureKap", s.toplamSure, s.kalan);

      let kalan = s.sure;
      document.getElementById("sayac").textContent = kalan;
      clearInterval(sayacId);
      sayacId = setInterval(() => {
        kalan--;
        document.getElementById("sayac").textContent = Math.max(kalan, 0);
        if (kalan <= 0) clearInterval(sayacId);
      }, 1000);
    });

    socket.on("cevapSayisi", (v) => {
      document.getElementById("cevapSayisi").textContent =
        v.cevaplayan + " / " + v.toplam + " kişi cevapladı";
    });

    socket.on("soruSonucu", (v) => {
      clearInterval(sayacId);
      goster("sonucEkrani");
      document.getElementById("dogruCevap").textContent = "Doğru cevap: " + v.dogruMetin;
      secenekCiz("sonucSecenekler", sonSecenekler.length ? sonSecenekler : [v.dogruMetin], v.dagilim, v.dogru);
      skorCiz("skorlar", v.siralama);
      document.getElementById("sonraki").textContent = v.sonSoruMu ? "Sonuçları Göster" : "Sonraki";
    });

    socket.on("oyunBitti", (siralama) => {
      clearInterval(sayacId);
      goster("bitisEkrani");
      skorCiz("sonSkorlar", siralama.slice(0, 10));
    });
  </script>
</body>
</html>
