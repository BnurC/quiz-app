<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <div class="sayfa">

    <div id="girisEkrani" class="ekran">
      <img class="logo" id="logo" alt="" style="display:none">
      <h1 class="baslik" id="baslik">Quiz</h1>
      <p class="altBaslik" id="altBaslik"></p>
      <input id="pinKutu" placeholder="PIN" inputmode="numeric" autocomplete="off">
      <input id="isimKutu" placeholder="İsim" maxlength="20" autocomplete="off">
      <button class="buton" id="katil">Katıl</button>
    </div>

    <div id="soruEkrani" class="ekran" style="display:none">
      <div class="skorBilgi" id="skorBilgi" style="display:none">
        <div id="skorSatir"></div>
        <div class="fark" id="farkSatir" style="display:none"></div>
      </div>
      <div class="sureCubuk" id="sureKap"></div>
      <h3 id="soruBilgi"></h3>
      <h2 class="soruMetin" id="soruMetin"></h2>
      <div class="secenekler" id="butonlar"></div>
    </div>

    <div id="sonucKutu" class="ekran" style="display:none">
      <h1 id="sonucBaslik"></h1>
      <div class="puanBuyuk" id="puanBuyuk"></div>
      <div id="eskiKutu" style="display:none">
        <div class="skorBilgi">
          <div id="eskiSatir"></div>
          <div class="fark" id="eskiFark" style="display:none"></div>
        </div>
        <h3>İlk 5</h3>
        <ul class="top5" id="top5"></ul>
      </div>
    </div>

    <div id="bitisKutu" class="ekran" style="display:none">
      <div class="kupa" id="kupa">🎉</div>
    </div>

    <p class="mesaj" id="durum"></p>

    <button class="buton" id="yeniKatil" style="display:none">Yeni Oyuna Katıl</button>
    <button class="buton ikincil" id="cik" style="display:none">Oyundan Çık</button>

  </div>

  <script src="/ayar.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let pin = "";
    let benimIsim = "";

    baslikKur();

    const urlPin = new URLSearchParams(location.search).get("pin");
    if (urlPin) {
      document.getElementById("pinKutu").value = urlPin;
      document.getElementById("isimKutu").focus();
    }

    function el(id) { return document.getElementById(id); }

    function durumYaz(metin, hata) {
      const d = el("durum");
      d.textContent = metin;
      d.className = hata ? "mesaj hata" : "mesaj";
    }

    function farkMetni(v) {
      if (v.sira === 1) return v.puan > 0 ? "👑 Liderlik sende!" : "";
      if (v.ust) return "⬆ " + v.ust.isim + " ile aranda " + v.ust.fark + " puan var";
      return "";
    }

    function satirYaz(satirId, farkId, v) {
      el(satirId).textContent = "Sıran: " + v.sira + " / " + v.kisi + "  •  Puanın: " + v.puan;
      const f = farkMetni(v);
      const fe = el(farkId);
      fe.textContent = f;
      fe.style.display = f ? "block" : "none";
    }

    function sayiSay(hedefEl, hedef, onek) {
      if (hedef <= 0) {
        hedefEl.textContent = onek + hedef;
        return;
      }
      const sure = 700;
      const bas = performance.now();
      function adim(t) {
        const k = Math.min((t - bas) / sure, 1);
        hedefEl.textContent = onek + Math.round(hedef * k);
        if (k < 1) requestAnimationFrame(adim);
      }
      requestAnimationFrame(adim);
    }

    function top5Ciz(liste) {
      const ul = el("top5");
      ul.innerHTML = "";
      const madalya = ["🥇", "🥈", "🥉"];
      liste.forEach((o, i) => {
        const li = document.createElement("li");
        li.style.animationDelay = 0.3 + i * 0.1 + "s";
        if (o.isim === benimIsim) li.className = "ben";
        const sol = document.createElement("span");
        sol.textContent = (madalya[i] || i + 1 + ".") + " " + o.isim;
        const sag = document.createElement("span");
        sag.textContent = o.puan;
        li.appendChild(sol);
        li.appendChild(sag);
        ul.appendChild(li);
      });
    }

    function sureBarKur(sure) {
      const kap = el("sureKap");
      kap.innerHTML = "";
      const d = document.createElement("div");
      d.style.animationDuration = sure + "s";
      kap.appendChild(d);
    }

    function hepsiniGizle() {
      ["girisEkrani", "soruEkrani", "sonucKutu", "bitisKutu"].forEach((id) => {
        el(id).style.display = "none";
      });
    }

    socket.on("connect", () => {
      try {
        const kayit = JSON.parse(sessionStorage.getItem("oyuncu"));
        if (kayit) socket.emit("tekrarKatil", { pin: kayit.pin, token: kayit.token });
      } catch (e) {
        sessionStorage.removeItem("oyuncu");
      }
    });

    socket.on("oturumYok", () => {
      sessionStorage.removeItem("oyuncu");
      hepsiniGizle();
      el("girisEkrani").style.display = "block";
      el("cik").style.display = "none";
      durumYaz("");
    });

    el("katil").addEventListener("click", () => {
      socket.emit("katil", { pin: el("pinKutu").value, isim: el("isimKutu").value });
    });

    el("yeniKatil").addEventListener("click", () => location.reload());

    el("cik").addEventListener("click", () => {
      if (confirm("Oyundan çıkmak istediğine emin misin?")) socket.emit("cik");
    });

    socket.on("ciktin", () => {
      sessionStorage.removeItem("oyuncu");
      location.href = "/";
    });

    socket.on("hata", (mesaj) => durumYaz(mesaj, true));

    socket.on("katildin", (veri) => {
      pin = veri.pin;
      benimIsim = veri.isim;
      sessionStorage.setItem("oyuncu", JSON.stringify(veri));
      el("girisEkrani").style.display = "none";
      el("cik").style.display = "inline-block";
      durumYaz(veri.isim + " olarak katıldın! Oyunun başlamasını bekle.");
    });

    // Yeni soru başlarken güncel sıra, puan ve fark
    socket.on("siraGuncel", (v) => {
      el("skorBilgi").style.display = "block";
      satirYaz("skorSatir", "farkSatir", v);
    });

    socket.on("okuma", (s) => {
      el("sonucKutu").style.display = "none";
      el("soruEkrani").style.display = "block";
      el("soruBilgi").textContent = "Soru " + s.no + " / " + s.toplam;
      el("soruMetin").textContent = s.soru;
      el("sureKap").innerHTML = "";
      el("butonlar").innerHTML = "";
      durumYaz("Soruyu oku, şıklar birazdan açılacak 👀");
    });

    socket.on("soru", (s) => {
      el("sonucKutu").style.display = "none";
      el("soruEkrani").style.display = "block";
      durumYaz("");
      el("soruBilgi").textContent = "Soru " + s.no + " / " + s.toplam;
      el("soruMetin").textContent = s.soru;
      sureBarKur(s.sure);

      const alan = el("butonlar");
      alan.innerHTML = "";
      s.secenekler.forEach((metin, i) => {
        const b = document.createElement("button");
        b.className = "sec s" + i;
        b.textContent = metin;
        b.addEventListener("click", () => {
          socket.emit("cevap", { pin: pin, secenek: i });
        });
        alan.appendChild(b);
      });
    });

    socket.on("cevapAlindi", () => {
      el("sonucKutu").style.display = "none";
      el("soruEkrani").style.display = "block";
      el("butonlar").innerHTML = "";
      durumYaz("Cevabın alındı ✔ Diğerleri bekleniyor...");
    });

    // Soru bitince: bu sorudan ÖNCEKİ sıra/puan/fark/ilk 5 + kazanılan puan
    socket.on("sonuc", (v) => {
      el("soruEkrani").style.display = "none";
      el("sonucKutu").style.display = "block";
      durumYaz("");

      const baslik = el("sonucBaslik");
      baslik.textContent = v.dogruMu ? "Doğru! ✅" : "Yanlış ya da cevapsız ❌";
      baslik.className = v.dogruMu ? "dogru" : "yanlis";
      sayiSay(el("puanBuyuk"), v.kazanilan, "+");
      if (navigator.vibrate) navigator.vibrate(v.dogruMu ? 80 : [60, 40, 60]);

      el("eskiKutu").style.display = "block";
      satirYaz("eskiSatir", "eskiFark", v.guncel);
      top5Ciz(v.top5);
    });

    socket.on("oyunBitti", (siralama) => {
      sessionStorage.removeItem("oyuncu");
      hepsiniGizle();
      el("bitisKutu").style.display = "block";
      el("cik").style.display = "none";
      el("yeniKatil").style.display = "inline-block";

      const sira = siralama.findIndex((o) => o.isim === benimIsim) + 1;
      el("kupa").textContent = sira === 1 ? "🥇" : sira === 2 ? "🥈" : sira === 3 ? "🥉" : "🎉";
      durumYaz(
        sira > 0
          ? "Oyun bitti! " + siralama.length + " kişi arasında " + sira + ". oldun."
          : "Oyun bitti! Sonuçlar ekranda."
      );
    });
  </script>
</body>

</html>
