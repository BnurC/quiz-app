<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="sayfa">

    <div id="girisEkrani">
      <h1>Quiz</h1>
      <input id="pinKutu" placeholder="PIN" inputmode="numeric" autocomplete="off">
      <input id="isimKutu" placeholder="İsim" maxlength="20" autocomplete="off">
      <button class="buton" id="katil">Katıl</button>
    </div>

    <div id="soruEkrani" style="display:none">
      <p class="skorBilgi" id="skorBilgi" style="display:none"></p>
      <h3 id="soruBilgi"></h3>
      <h2 class="soruMetin" id="soruMetin"></h2>
      <div class="secenekler" id="butonlar"></div>
    </div>

    <p class="mesaj" id="durum"></p>

    <button class="buton" id="yeniKatil" style="display:none">Yeni Oyuna Katıl</button>
    <button class="buton ikincil" id="cik" style="display:none">Oyundan Çık</button>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let pin = "";
    let benimIsim = "";

    const urlPin = new URLSearchParams(location.search).get("pin");
    if (urlPin) {
      document.getElementById("pinKutu").value = urlPin;
      document.getElementById("isimKutu").focus();
    }

    function durumYaz(metin, hata) {
      const d = document.getElementById("durum");
      d.textContent = metin;
      d.className = hata ? "mesaj hata" : "mesaj";
    }

    function skorYaz(metin) {
      const e = document.getElementById("skorBilgi");
      e.textContent = metin;
      e.style.display = metin ? "block" : "none";
    }

    socket.on("connect", () => {
      try {
        const kayit = JSON.parse(sessionStorage.getItem("oyuncu"));
        if (kayit) socket.emit("tekrarKatil", { pin: kayit.pin, token: kayit.token });
      } catch (e) {
        sessionStorage.removeItem("oyuncu");
      }
    });

    socket.on("oturumYok", () => {
      sessionStorage.removeItem("oyuncu");
      document.getElementById("girisEkrani").style.display = "block";
      document.getElementById("soruEkrani").style.display = "none";
      document.getElementById("cik").style.display = "none";
      durumYaz("");
    });

    document.getElementById("katil").addEventListener("click", () => {
      socket.emit("katil", {
        pin: document.getElementById("pinKutu").value,
        isim: document.getElementById("isimKutu").value,
      });
    });

    document.getElementById("yeniKatil").addEventListener("click", () => {
      location.reload();
    });

    document.getElementById("cik").addEventListener("click", () => {
      if (confirm("Oyundan çıkmak istediğine emin misin?")) {
        socket.emit("cik");
      }
    });

    socket.on("ciktin", () => {
      sessionStorage.removeItem("oyuncu");
      location.href = "/";
    });

    socket.on("hata", (mesaj) => durumYaz(mesaj, true));

    socket.on("katildin", (veri) => {
      pin = veri.pin;
      benimIsim = veri.isim;
      sessionStorage.setItem("oyuncu", JSON.stringify(veri));
      document.getElementById("girisEkrani").style.display = "none";
      document.getElementById("cik").style.display = "inline-block";
      durumYaz(veri.isim + " olarak katıldın! Oyunun başlamasını bekle.");
    });

    // Yeni soru başlarken: güncel sıra ve puan
    socket.on("siraGuncel", (v) => {
      skorYaz("Sıran: " + v.sira + " / " + v.kisi + "  •  Puanın: " + v.puan);
    });

    socket.on("soru", (s) => {
      document.getElementById("soruEkrani").style.display = "block";
      durumYaz("");
      document.getElementById("soruBilgi").textContent = "Soru " + s.no + " / " + s.toplam;
      document.getElementById("soruMetin").textContent = s.soru;

      const alan = document.getElementById("butonlar");
      alan.innerHTML = "";
      s.secenekler.forEach((metin, i) => {
        const b = document.createElement("button");
        b.className = "sec s" + i;
        b.textContent = metin;
        b.addEventListener("click", () => {
          socket.emit("cevap", { pin: pin, secenek: i });
        });
        alan.appendChild(b);
      });
    });

    socket.on("cevapAlindi", () => {
      document.getElementById("soruEkrani").style.display = "block";
      document.getElementById("butonlar").innerHTML = "";
      durumYaz("Cevabın alındı, diğerleri bekleniyor...");
    });

    // Soru bitince: bu sorudan ÖNCEKİ sıra/puan + bu sorudan kazanılan puan
    socket.on("sonuc", (v) => {
      document.getElementById("soruEkrani").style.display = "block";
      document.getElementById("butonlar").innerHTML = "";
      document.getElementById("soruMetin").textContent = "";
      durumYaz(
        (v.dogruMu ? "Doğru!" : "Yanlış ya da cevapsız.") + " +" + v.kazanilan + " puan"
      );
      if (v.oncekiSira) {
        skorYaz("Sıran: " + v.oncekiSira + " / " + v.kisi + "  •  Puanın: " + v.oncekiPuan);
      } else {
        skorYaz("");
      }
    });

    socket.on("oyunBitti", (siralama) => {
      sessionStorage.removeItem("oyuncu");
      skorYaz("");
      document.getElementById("cik").style.display = "none";
      document.getElementById("yeniKatil").style.display = "inline-block";
      document.getElementById("soruEkrani").style.display = "none";
      const sira = siralama.findIndex((o) => o.isim === benimIsim) + 1;
      durumYaz(
        sira > 0
          ? "Oyun bitti! " + siralama.length + " kişi arasında " + sira + ". oldun."
          : "Oyun bitti! Sonuçlar ekranda."
      );
    });
  </script>
</body>
</html>
